<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Confirmer la suppression</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .warning { color: #f44336; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .btn-danger { background-color: #f44336; color: white; border: none; }
        .btn-cancel { background-color: #9E9E9E; color: white; border: none; }
    </style>
</head>
<body>
    <h1 class="warning">Confirmer la suppression</h1>
    
    <p>Êtes-vous sûr de vouloir supprimer le produit <strong>{{ produit.nom }}</strong> ?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Oui, supprimer</button>
        <a href="{% url 'liste_produits' %}"><button type="button" class="btn-cancel">Annuler</button></a>
    </form>
</body>
</html>
