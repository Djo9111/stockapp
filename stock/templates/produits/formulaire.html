<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire produit</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 400px; }
        input { width: 100%; padding: 8px; margin: 5px 0 15px 0; }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        .retour { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Formulaire produit</h1>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enregistrer</button>
    </form>
    
    <div class="retour">
        <a href="{% url 'liste_produits' %}">Retour à la liste</a>
    </div>
</body>
</html>
