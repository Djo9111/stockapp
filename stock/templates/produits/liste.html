<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des produits</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .btn { padding: 5px 10px; text-decoration: none; margin: 2px; }
        .btn-ajouter { background-color: #4CAF50; color: white; }
        .btn-modifier { background-color: #2196F3; color: white; }
        .btn-supprimer { background-color: #f44336; color: white; }
    </style>
</head>
<body>
    <h1>Liste des produits</h1>
    <a href="{% url 'ajouter_produit' %}" class="btn btn-ajouter">Ajouter un produit</a>
    
    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for produit in produits %}
            <tr>
                <td>{{ produit.nom }}</td>
                <td>{{ produit.stockPdt }}</td>
                <td>
                    <a href="{% url 'modifier_produit' produit.id %}" class="btn btn-modifier">Modifier</a>
                    <a href="{% url 'supprimer_produit' produit.id %}" class="btn btn-supprimer">Supprimer</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">Aucun produit disponible</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
